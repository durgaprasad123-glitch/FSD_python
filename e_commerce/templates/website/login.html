<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Page</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      :root{
        --bg1: #0f172a; /* dark blue */
        --bg2: #04243a; /* teal */
      }
      body{
        min-height:100vh;
        background: linear-gradient(135deg,var(--bg1) 0%, var(--bg2) 100%);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      }
      .glass-card{
        background: rgba(255,255,255,0.06);
        border-radius: 12px;
        padding: 2rem;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 10px 30px rgba(2,6,23,0.6), 0 2px 6px rgba(2,6,23,0.5);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255,255,255,0.06);
        color: #e6eef8;
      }
      .brand {
        font-weight:700;
        letter-spacing:0.3px;
        display:flex;
        align-items:center;
        gap:.5rem;
      }
      .brand .leaf{
        width:32px;height:32px;border-radius:6px;background:linear-gradient(135deg,#2dd4bf,#86efac);display:inline-block
      }
      .form-control:focus{
        box-shadow: 0 0 0 0.15rem rgba(34,197,94,0.12);
        border-color: #22c55e;
      }
      .btn-primary{
        background-image: linear-gradient(90deg,#16a34a,#059669);
        border: none;
      }
      .small-muted{ color: rgba(230,238,248,0.7); font-size:0.9rem }
    </style>
  </head>
  <body>

    <main class="d-flex align-items-center justify-content-center min-vh-100 py-4">
      <div class="glass-card text-start">

        <div class="mb-3 text-center">
          <div class="brand justify-content-center">
            <span class="leaf" aria-hidden="true"></span>
            <div>
              <div style="font-size:1.15rem">Login page</div>
              <div class="small-muted">Login to continue</div>
            </div>
          </div>
        </div>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form id="loginForm" novalidate action="{% url 'login' %}" method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label for="username" class="form-label">Username or Email</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="yourname@example.com" required>
            <div class="invalid-feedback">Please enter your username or email.</div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required minlength="6">
            <div class="invalid-feedback" id="passwordFeedback">Password is required and must be at least 6 characters.</div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" value="" id="remember">
              <label class="form-check-label small-muted" for="remember">Remember me</label>
            </div>
            <a href="#" class="small-muted" style="text-decoration:none">Forgot?</a>
          </div>

          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-primary btn-lg">Sign in</button>
          </div>

          <div class="text-center small-muted">Don't have an account? <a href="#" style="color:#9ae6b4; text-decoration:none">Sign up</a></div>

        </form>

      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
